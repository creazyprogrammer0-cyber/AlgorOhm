    // --- SMOOTH ANIMATED NUMBER HOOK ---
    function useAnimatedNumber(targetValue, duration = 520, decimals = 0) {
      const [displayValue, setDisplayValue] = useState(targetValue);
      const prevValueRef = useRef(targetValue);

      useEffect(() => {
        const startValue = prevValueRef.current;
        const endValue = Number(targetValue);
        if (startValue === endValue) return;

        let startTime = null;
        let rafId = null;

        const step = (timestamp) => {
          if (!startTime) startTime = timestamp;
          const progress = Math.min((timestamp - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 4);
          const current = startValue + (endValue - startValue) * eased;
          setDisplayValue(Number(current.toFixed(decimals)));

          if (progress < 1) {
            rafId = requestAnimationFrame(step);
          } else {
            prevValueRef.current = endValue;
            setDisplayValue(Number(endValue.toFixed(decimals)));
          }
        };

        rafId = requestAnimationFrame(step);
        return () => {
          if (rafId) cancelAnimationFrame(rafId);
        };
      }, [targetValue, duration, decimals]);

      return displayValue;
    }

    const SpotlightCard = ({ children, className = '', onClick, glowColor = 'rgba(0, 229, 255, 0.13)' }) => {
      const cardRef = useRef(null);
      const [coords, setCoords] = useState({ x: -500, y: -500, opacity: 0 });

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        setCoords({
          x: e.clientX - rect.left,
          y: e.clientY - rect.top,
          opacity: 1
        });
      };

      const handleMouseLeave = () => {
        setCoords((prev) => ({ ...prev, opacity: 0 }));
      };

      return (
        <div
          ref={cardRef}
          onClick={onClick}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          className={`relative overflow-hidden transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] ${className}`}

      // One-Click Download Standalone HTML Handler
      const handleDownloadStandaloneHtml = () => {

        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });

      // Graceful Image Fallback Handler
      const handleImageError = (e, fallbackLabel = 'ALGOROHM OPTICAL FEED') => {
        e.currentTarget.onerror = null;
        e.currentTarget.src = `https://placehold.co/1200x800/0B0F17/00E5FF?text=${encodeURIComponent(fallbackLabel)}`;
      };

      // --- HERO 2D SPRING-PHYSICS KINEMATIC & TELEMETRY CANVAS ANIMATION ---
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let tick = 0;

        const updateSize = () => {
          const parent = canvas.parentElement;
          if (!parent) return;
          const dpr = window.devicePixelRatio || 1;
          const rect = parent.getBoundingClientRect();
          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };

        updateSize();
        window.addEventListener('resize', updateSize);

        const lidarPoints = Array.from({ length: 120 }, (_, i) => ({
          angle: (i / 120) * Math.PI * 2,
          baseDist: 70 + (i % 8) * 17,
          zLayer: i % 3
        }));

        // Rounded Rect Helper for cross-browser compatibility
        const drawRoundedRect = (x, y, w, h, r) => {
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(x, y, w, h, r);
          } else {
            ctx.rect(x, y, w, h);
          }
        };

        const render = () => {
          if (simRunning) {
            tick += 0.022;
          }

          const width = canvas.width / (window.devicePixelRatio || 1);
          const height = canvas.height / (window.devicePixelRatio || 1);

          ctx.clearRect(0, 0, width, height);

          // 1. Subtle Precision Engineering Grid
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.065)';
          ctx.lineWidth = 1;
          const gridSize = 28;
          for (let x = 0; x < width; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();
          }
          for (let y = 0; y < height; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
          }

          const baseX = width * 0.23;
          const baseY = height * 0.79;

          let cmdPercentX = targetX;
          let cmdPercentY = targetY;

          if (autoTrajectory && simRunning) {
            cmdPercentX = 64 + Math.sin(tick * 1.35) * 17;
            cmdPercentY = 42 + Math.sin(tick * 2.7) * 16;
          }

          // --- SPRING-DAMPED INTERPOLATION FOR ULTRA-SMOOTH INERTIA ---
          const phys = physicsRef.current;
          const stiffness = 0.085;
          const damping = 0.78;

          const forceX = (cmdPercentX - phys.currentX) * stiffness;
          const forceY = (cmdPercentY - phys.currentY) * stiffness;

          phys.vx = (phys.vx + forceX) * damping;
          phys.vy = (phys.vy + forceY) * damping;

          phys.currentX += phys.vx;
          phys.currentY += phys.vy;

          const breathX = simRunning ? Math.sin(tick * 1.6) * 3.5 : 0;
          const breathY = simRunning ? Math.cos(tick * 1.25) * 2.8 : 0;

          const goalX = (phys.currentX / 100) * width + breathX;
          const goalY = (phys.currentY / 100) * height + breathY;

          const cmdScreenX = (cmdPercentX / 100) * width;
          const cmdScreenY = (cmdPercentY / 100) * height;

          // 2-Link + Wrist Analytical Inverse Kinematics
          const L1 = Math.min(width, height) * 0.31;
          const L2 = Math.min(width, height) * 0.26;
          const L3 = Math.min(width, height) * 0.11;

          const wristTargetX = goalX - L3 * 0.85;
          const wristTargetY = goalY;

          const dx = wristTargetX - baseX;
          const dy = wristTargetY - baseY;
          const dist = Math.min(Math.sqrt(dx * dx + dy * dy), L1 + L2 - 4);

          const cosAngle2 = Math.max(-1, Math.min(1, (dist * dist - L1 * L1 - L2 * L2) / (2 * L1 * L2)));
          const theta2 = -Math.acos(cosAngle2);
          const k1 = L1 + L2 * Math.cos(theta2);
          const k2 = L2 * Math.sin(theta2);
          const theta1 = Math.atan2(dy, dx) - Math.atan2(k2, k1);

          const elbowX = baseX + L1 * Math.cos(theta1);
          const elbowY = baseY + L1 * Math.sin(theta1);

          const wristX = elbowX + L2 * Math.cos(theta1 + theta2);
          const wristY = elbowY + L2 * Math.sin(theta1 + theta2);

          const eeX = wristX + L3;
          const eeY = wristY;

          if (simRunning) {
            phys.trail.push({ x: eeX + 10, y: eeY });
            if (phys.trail.length > 36) phys.trail.shift();
          }

          const velocityMag = Math.sqrt(phys.vx * phys.vx + phys.vy * phys.vy);
          const reachFactor = Math.abs(eeX - baseX) / (L1 + L2 + L3);
          const shoulderTorque = +(
            38 +
            loadMassKg * 6.8 * reachFactor +
            velocityMag * 18 +
            Math.abs(Math.sin(tick)) * 2.4
          ).toFixed(1);
          const elbowTorque = +(
            19 +
            loadMassKg * 4.1 * reachFactor +
            velocityMag * 11 +
            Math.abs(Math.cos(tick)) * 1.8
          ).toFixed(1);
          const busCurrent = +((shoulderTorque + elbowTorque) * 0.14).toFixed(1);
          const busImpedance = +(1.15 + (loadMassKg / 35) * 0.65).toFixed(2);

          if (Math.floor(tick * 25) % 4 === 0) {
            setLiveTelemetry({
              j1Angle: +((theta1 * 180) / Math.PI).toFixed(1),
              j2Angle: +((theta2 * 180) / Math.PI).toFixed(1),
              j3Angle: +((-(theta1 + theta2) * 180) / Math.PI).toFixed(1),
              shoulderTorque,
              elbowTorque,
              busCurrent,
              busImpedance,
              loopLatency: +(1.58 + Math.sin(tick) * 0.14).toFixed(2)
            });
          }

          // --- DRAW END-EFFECTOR VELOCITY RIBBON TRAIL ---
          if (phys.trail.length > 2) {
            ctx.beginPath();
            for (let i = 0; i < phys.trail.length; i++) {
              const pt = phys.trail[i];
              if (i === 0) ctx.moveTo(pt.x, pt.y);
              else ctx.lineTo(pt.x, pt.y);
            }
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.28)';
            ctx.lineWidth = 2;
            ctx.stroke();
          }

          // --- MODE SPECIFIC OVERLAYS ---
          if (simMode === 'lidar') {
            const scanAngle = (tick * 1.7) % (Math.PI * 2);
            const grad = ctx.createRadialGradient(eeX, eeY, 4, eeX, eeY, 180);
            grad.addColorStop(0, 'rgba(0, 229, 255, 0.28)');
            grad.addColorStop(1, 'rgba(0, 229, 255, 0.0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(eeX, eeY);
            ctx.arc(eeX, eeY, 180, scanAngle - 0.55, scanAngle + 0.55);
            ctx.closePath();
            ctx.fill();

            lidarPoints.forEach((pt, idx) => {
              const r = pt.baseDist + Math.sin(tick * 2 + idx) * 7;
              const px = eeX + Math.cos(pt.angle) * r;
              const py = eeY + Math.sin(pt.angle) * r * 0.68;
              if (px > 12 && px < width - 12 && py > 12 && py < height - 12) {
                const angleDiff = Math.abs(((pt.angle - scanAngle + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
                const active = angleDiff < 0.7;
                ctx.fillStyle = active
                  ? '#00E5FF'
                  : pt.zLayer === 0
                  ? 'rgba(14, 165, 233, 0.45)'
                  : 'rgba(245, 158, 11, 0.35)';
                ctx.beginPath();
                ctx.arc(px, py, active ? 2.7 : 1.6, 0, Math.PI * 2);
                ctx.fill();
              }
            });
          }

          if (simMode === 'neural') {
            for (let i = -2; i <= 2; i++) {
              const isOptimal = i === 0;
              ctx.beginPath();
              ctx.moveTo(baseX, baseY - 30);
              ctx.bezierCurveTo(
                baseX + 70,
                baseY - 140 + i * 28,
                eeX - 90,
                eeY + i * 32,
                eeX,
                eeY
              );
              ctx.strokeStyle = isOptimal ? '#00E5FF' : 'rgba(0, 229, 255, 0.18)';
              ctx.lineWidth = isOptimal ? 2.4 : 1;
              ctx.setLineDash(isOptimal ? [] : [4, 4]);
              ctx.stroke();
              ctx.setLineDash([]);
            }
          }

          // --- DRAW COMMANDED SETPOINT GHOST RETICLE ---
          ctx.beginPath();
          ctx.arc(cmdScreenX + 10, cmdScreenY, 8, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(245, 158, 11, 0.45)';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // --- DRAW ROBOTIC CHASSIS PEDESTAL ---
          ctx.fillStyle = '#1E293B';
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 2;
          drawRoundedRect(baseX - 38, baseY, 76, 26, 6);
          ctx.fill();
          ctx.stroke();

          ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(20, baseY + 26);
          ctx.lineTo(width - 20, baseY + 26);
          ctx.stroke();

          // --- DRAW KINEMATIC LINKS (OHM CARBON-ALUMINUM) ---
          const drawLink = (x1, y1, x2, y2, thickness, colorStroke) => {
            ctx.save();
            ctx.strokeStyle = '#0F172A';
            ctx.lineWidth = thickness + 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            ctx.strokeStyle = colorStroke;
            ctx.lineWidth = thickness;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(0, 229, 255, 0.7)';
            ctx.lineWidth = 1.6;
            ctx.setLineDash([6, 4]);
            ctx.lineDashOffset = -tick * 16;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.restore();
          };

          drawLink(baseX, baseY, elbowX, elbowY, 14, '#334155');
          drawLink(elbowX, elbowY, wristX, wristY, 11, '#475569');
          drawLink(wristX, wristY, eeX, eeY, 7, '#64748B');

          // --- DRAW QDD ACTUATOR JOINTS WITH TORQUE HEAT RING ---
          const drawActuatorNode = (x, y, radius, torqueRatio, label) => {
            ctx.beginPath();
            ctx.arc(x, y, radius + 6, 0, Math.PI * 2);
            ctx.strokeStyle = torqueRatio > 0.65 ? 'rgba(245, 158, 11, 0.45)' : 'rgba(0, 229, 255, 0.35)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x, y, radius + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(torqueRatio, 1));
            ctx.strokeStyle = '#F59E0B';
            ctx.lineWidth = 3.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#0B0F17';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#E2E8F0';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#F59E0B';
            ctx.fill();

            ctx.font = '600 10px "JetBrains Mono", ui-monospace, monospace';
            ctx.fillStyle = '#94A3B8';
            ctx.fillText(label, x - 18, y - radius - 11);
          };

          drawActuatorNode(baseX, baseY, 14, shoulderTorque / 320, `J1:${shoulderTorque}Nm`);
          drawActuatorNode(elbowX, elbowY, 12, elbowTorque / 240, `J2:${elbowTorque}Nm`);
          drawActuatorNode(wristX, wristY, 9, (loadMassKg / 35) * 0.85, 'J3:WRIST');

          // --- DRAW END-EFFECTOR GRIPPER & PAYLOAD VECTOR ---
          ctx.strokeStyle = '#00E5FF';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(eeX, eeY - 10);
          ctx.lineTo(eeX + 12, eeY - 10);
          ctx.moveTo(eeX, eeY + 10);
          ctx.lineTo(eeX + 12, eeY + 10);
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(eeX + 10, eeY, 16, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(0, 229, 255, 0.55)';
          ctx.lineWidth = 1.2;
          ctx.setLineDash([3, 3]);
          ctx.stroke();
          ctx.setLineDash([]);

          const vectorLen = 18 + (loadMassKg / 35) * 42;
          ctx.strokeStyle = '#F59E0B';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(eeX + 10, eeY);
          ctx.lineTo(eeX + 10, eeY + vectorLen);
          ctx.lineTo(eeX + 6, eeY + vectorLen - 6);
          ctx.moveTo(eeX + 10, eeY + vectorLen);
          ctx.lineTo(eeX + 14, eeY + vectorLen - 6);
          ctx.stroke();

          ctx.font = '700 11px "JetBrains Mono", ui-monospace, monospace';
          ctx.fillStyle = '#F59E0B';
          ctx.fillText(`${loadMassKg.toFixed(1)}kg LOAD`, eeX + 20, eeY + vectorLen - 2);

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', updateSize);
        };

        const relX = Math.max(32, Math.min(88, Math.round(((clientX - rect.left) / rect.width) * 100)));

                </button>

                {!pilotSubmitted ? (
                  <form onSubmit={handlePilotSubmit} className="space-y-4">
                    <div className="flex items-center gap-2.5">
                      <AlgorOhmLogo className="w-8 h-8" />
                      <span className="text-xs font-mono uppercase text-cyan-400 font-semibold">
                        DEPLOYMENT ENGINEERING BRIEFING
                      </span>
                    </div>
                    <h3 className="text-2xl font-bold text-white font-display">Request Unit Demo & Pilot</h3>
                    <p className="text-xs text-slate-400">
                      Connect directly with an AlgorOhm Systems Architect to schedule a live telemetry demonstration or on-site pilot cell evaluation.
                    </p>

                    {pilotFormError && (
                      <div className="p-3 rounded-lg bg-rose-500/15 border border-rose-500/40 text-xs text-rose-300">
                        {pilotFormError}
                      </div>
                    )}

                    <div>
                      <label className="block text-xs font-mono text-slate-300 mb-1">FULL NAME *</label>
                      <input
                        type="text"
                        placeholder="Dr. Elena Vance"
                        value={pilotForm.fullName}
                        onChange={(e) => setPilotForm({ ...pilotForm, fullName: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm text-white focus:border-cyan-400 focus:outline-none"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-mono text-slate-300 mb-1">WORK EMAIL *</label>
                        <input
                          type="email"
                          placeholder="elena@aerofab.com"
                          value={pilotForm.workEmail}
                          onChange={(e) => setPilotForm({ ...pilotForm, workEmail: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm text-white focus:border-cyan-400 focus:outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-mono text-slate-300 mb-1">ORGANIZATION *</label>
                        <input
                          type="text"
                          placeholder="AeroFab Dynamics"
                          value={pilotForm.company}
                          onChange={(e) => setPilotForm({ ...pilotForm, company: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm text-white focus:border-cyan-400 focus:outline-none"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-mono text-slate-300 mb-1">PRIMARY PLATFORM</label>
                        <select
                          value={pilotForm.platformInterest}
                          onChange={(e) => setPilotForm({ ...pilotForm, platformInterest: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm text-white focus:border-cyan-400 focus:outline-none"
                        >
                          {ROBOT_PLATFORMS.map((r) => (
                            <option key={r.id} value={r.name}>
                              {r.name}
                            </option>
                          ))}
                          <option value="Heterogeneous Swarm Fleet">Heterogeneous Swarm Fleet</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-mono text-slate-300 mb-1">TARGET SCALE</label>
                        <input
                          type="text"
                          value={pilotForm.deploymentScale}
                          onChange={(e) => setPilotForm({ ...pilotForm, deploymentScale: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm text-white focus:border-cyan-400 focus:outline-none"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-300 mb-1">
                        PAYLOAD / CYCLE TIME REQUIREMENTS (OPTIONAL)
                      </label>
                      <textarea
                        rows={2}
                        placeholder="e.g., 14kg wafer cassettes, ISO Class 4 cleanroom, 24/7 shift handoff..."
                        value={pilotForm.environmentNotes}
                        onChange={(e) => setPilotForm({ ...pilotForm, environmentNotes: e.target.value })}
                        className="w-full px-3.5 py-2 rounded-lg bg-slate-950 border border-slate-800 text-sm text-white focus:border-cyan-400 focus:outline-none"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-sky-500 hover:from-cyan-400 hover:to-sky-400 text-slate-950 font-bold text-sm transition-all cursor-pointer"
                    >
                      Confirm Pilot Engineering Allocation
                    </button>
                  </form>
                ) : (
                  <div className="py-6 text-center space-y-4">
                    <div className="w-14 h-14 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 flex items-center justify-center mx-auto">
                      <CheckCircle2 className="w-8 h-8" />
                    </div>
                    <h4 className="text-2xl font-bold text-white font-display">Telemetry Briefing Scheduled</h4>
                    <p className="text-sm text-slate-300 max-w-md mx-auto">
                      Thank you, <span className="text-cyan-300 font-semibold">{pilotForm.fullName}</span>. Our Deployment Engineering team has logged your request for{' '}
                      <span className="text-amber-300 font-semibold">{pilotForm.platformInterest}</span> ({pilotForm.deploymentScale}).
                    </p>
                    <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 text-xs font-mono text-slate-400">
                      DISPATCH ID: ALG-{Math.floor(100000 + Math.random() * 900000)} • SLA RESPONSE &lt; 4 HOURS
                    </div>
                    <button
                      onClick={() => setDemoModalOpen(false)}
                      className="px-6 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs font-mono uppercase cursor-pointer"
                    >
                      Return to Control Center
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* --- MODAL 2: WHITEPAPER EXECUTIVE BRIEF VIEWER --- */}
          {selectedWhitepaper && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="relative w-full max-w-xl rounded-2xl bg-[#0E1420] border border-slate-700 p-6 sm:p-8 shadow-2xl text-slate-100 space-y-4">
                <button
                  onClick={() => setSelectedWhitepaper(null)}
                  className="absolute top-5 right-5 p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 cursor-pointer"
                >
                  <X className="w-5 h-5" />
                </button>
                <div className="text-xs font-mono text-cyan-400">
                  {selectedWhitepaper.code} // {selectedWhitepaper.category}
                </div>
                <h3 className="text-xl font-bold text-white pr-6 font-display">{selectedWhitepaper.title}</h3>
                <p className="text-xs font-mono text-slate-400">{selectedWhitepaper.authors}</p>
                <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 text-sm text-slate-300 leading-relaxed space-y-2">
                  <div className="text-xs font-mono uppercase text-amber-400">Executive Technical Abstract:</div>
                  <p>{selectedWhitepaper.abstract}</p>
                  <p className="text-xs text-slate-400 pt-2">
                    Key Result: Verified across 10,000+ hours of continuous dynamometer and bipedal gait testing with 0.9 mΩ SiC inverter buses and AlgorOS 4.2.
                  </p>
                </div>
                <div className="flex justify-end gap-3 pt-2">
                  <button
                    onClick={() => setSelectedWhitepaper(null)}
                    className="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs font-mono cursor-pointer"
                  >
                    Close Preview
                  </button>
                  <button
                    onClick={() => {
                      const wpTitle = selectedWhitepaper.title;
                      setSelectedWhitepaper(null);
                      setPilotForm((prev) => ({
                        ...prev,
                        environmentNotes: `Requesting full dataset & PDF for: ${wpTitle}`
                      }));
                      setPilotSubmitted(false);
                      setDemoModalOpen(true);
                    }}
                    className="px-4 py-2 rounded-lg bg-cyan-400 text-slate-950 font-bold text-xs font-mono cursor-pointer"
                  >
                    Request Full CAD & Benchmark PDF
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* --- MODAL 3: HIGH-RES FIELD OPTICS LIGHTBOX --- */}
          {lightboxPhoto && (
            <div
              onClick={() => setLightboxPhoto(null)}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-xl"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="relative w-full max-w-4xl rounded-3xl bg-[#0B0F17] border border-slate-700 overflow-hidden shadow-2xl"
              >
                <div className="relative h-96 sm:h-[460px] w-full bg-slate-950">
                  <img
                    src={lightboxPhoto.image}
                    alt={lightboxPhoto.title}
                    onError={(e) => handleImageError(e, lightboxPhoto.title)}
                    className="w-full h-full object-cover object-center"
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#0B0F17] via-transparent to-slate-950/50" />
                  <button
                    onClick={() => setLightboxPhoto(null)}
                    className="absolute top-4 right-4 p-2.5 rounded-full bg-slate-950/80 text-slate-300 hover:text-white border border-slate-700 cursor-pointer"
                  >
                    <X className="w-5 h-5" />
                  </button>
                  <div className="absolute top-4 left-4 px-3 py-1 rounded bg-slate-950/85 border border-slate-800 text-xs font-mono text-cyan-400">
                    {lightboxPhoto.camera}
                  </div>
                </div>
                <div className="p-6 sm:p-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <div className="text-xs font-mono text-amber-400 uppercase">{lightboxPhoto.location}</div>
                    <h3 className="text-2xl font-bold text-white mt-1 font-display">{lightboxPhoto.title}</h3>
                    <div className="text-xs font-mono text-emerald-400 mt-2">{lightboxPhoto.telemetry}</div>
                  </div>
                  <button
                    onClick={() => {
                      const title = lightboxPhoto.title;
                      setLightboxPhoto(null);
                      setPilotForm((prev) => ({
                        ...prev,
                        environmentNotes: `Inquiry regarding deployment cell: ${title}`
                      }));
                      setPilotSubmitted(false);
                      setDemoModalOpen(true);
                    }}
                    className="px-5 py-3 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold text-xs font-mono uppercase cursor-pointer shrink-0"
                  >
                    Request Cell CAD & Specs
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
